[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "algoflow-x402"
version = "1.0.0"
description = "Algorand-native autonomous bounty escrow and x402 Payment Required microsettlement engine"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "AlgoFlow Core Team", email = "dev@algoflow.network"}
]
keywords = ["algorand", "x402", "http402", "smart-contracts", "teal", "bounty", "fastapi"]
dependencies = [
    "py-algorand-sdk>=2.12.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
